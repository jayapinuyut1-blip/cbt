name: Keep Supabase Awake

# Menjalankan ping ringan setiap 3 hari sekali agar Supabase Free Tier
# tidak mengalami auto-pause setelah 7 hari tanpa aktivitas.
on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via Production App & REST API
        run: |
          # 1. Ping halaman /login produksi (SSR otomatis query tabel settings di Supabase)
          echo "Mem-ping https://cbt.smkn3kotamobagu.sch.id/login ..."
          HTTP_CODE=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 25 "https://cbt.smkn3kotamobagu.sch.id/login")
          echo "HTTP status produksi: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "Peringatan: respon halaman login $HTTP_CODE"
          fi

          # 2. Jika GitHub Secrets diisi, ping juga REST API Supabase secara langsung
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            curl -fsS --max-time 20 "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=kunci&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
            echo ""
            echo "Ping langsung Supabase REST API berhasil."
          else
            echo "Secrets SUPABASE_URL/SUPABASE_ANON_KEY tidak diisi; mengandalkan ping SSR halaman produksi (OK)."
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
          echo "Keep-alive selesai."
